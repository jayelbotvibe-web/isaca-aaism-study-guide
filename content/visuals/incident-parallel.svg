<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 685" role="img" aria-labelledby="incident-parallel-title incident-parallel-desc" font-family="Arial, Helvetica, sans-serif">
<title id="incident-parallel-title">Run coordinated response tracks in parallel</title>
<desc id="incident-parallel-desc">Detection, evidence preservation and triage establish impact, authority, affected systems and known facts. Coordinated tracks then run in parallel rather than waiting for one another to finish. Containment restricts unsafe actions, revokes access or isolates affected components, and verifies the result. Notification identifies all applicable legal, sector and contractual duties, tracks their separate triggers and deadlines, and communicates facts and updates as required. The diagram supplies no universal notification deadline. Continuity activates a safe fallback, validates service quality, and reconciles state before returning to the AI-assisted process. New facts update all tracks; restoration needs evidence and authorization.</desc>
<defs><marker id="incident-parallel-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" viewBox="0 0 8 8"><path d="M0,1 L7,4 L0,7" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
