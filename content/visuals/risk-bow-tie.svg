<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 665" role="img" aria-labelledby="risk-bow-tie-title risk-bow-tie-desc" font-family="Arial, Helvetica, sans-serif">
<title id="risk-bow-tie-title">Write the event between causes and consequences</title>
<desc id="risk-bow-tie-desc">The scoped event is restricted contract terms reaching an unauthorized audience. Causes include a broad retrieval identity that fails to enforce caller rights and a response cache shared across audiences. Preventive controls include caller-entitlement checks and cache isolation. Consequences include privacy or contract harm and business response, claims and trust impacts. Controls on the consequence side restrict access, investigate, notify where required and provide redress. They can limit harm and support recovery without undoing the original disclosure. Assess inherent exposure, implement and test treatment, assess residual exposure, then decide and monitor. Acceptance requires evidence, expiry and lawful residual exposure within delegated limits.</desc>
<defs><marker id="risk-bow-tie-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" viewBox="0 0 8 8"><path d="M0,1 L7,4 L0,7" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="960" height="665" fill="#FBFCFD"/>
<text x="26" y="35" font-size="25" fill="#182633" font-weight="700" text-anchor="start">Write the event between causes and consequences</text>
<text x="26" y="65" font-size="17" fill="#526273" font-weight="400" text-anchor="start">Calder risk R-07: unauthorized disclosure of restricted contract terms.</text>
<path d="M26,86 L934,86" fill="none" stroke="#BBCAD6" stroke-width="2"/>
