<text x="42" y="323" font-size="19" fill="#6E3B7E" font-weight="700" text-anchor="start">Shared response cache</text>
<text x="42" y="352" font-size="17" fill="#182633" font-weight="400" text-anchor="start">Audience not partitioned</text>
