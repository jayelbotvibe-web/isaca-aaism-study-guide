<path d="M470,537 L486,537" fill="none" stroke="#26557A" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#risk-bow-tie-arrow)"/>
<path d="M703,537 L719,537" fill="none" stroke="#26557A" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#risk-bow-tie-arrow)"/>
<text x="26" y="625" font-size="18" fill="#26557A" font-weight="700" text-anchor="start">Acceptance requires lawful exposure within delegated limits, with evidence and expiry.</text>
</svg>
