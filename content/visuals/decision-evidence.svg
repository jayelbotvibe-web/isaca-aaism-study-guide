<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 655" role="img" aria-labelledby="decision-evidence-title decision-evidence-desc" font-family="Arial, Helvetica, sans-serif">
<title id="decision-evidence-title">Build an evidence packet a reviewer can use</title>
<desc id="decision-evidence-desc">Assemble a case packet containing model, data and configuration versions, relevant input context, the decision and supporting evidence, known explanation-fidelity limits, and the human review or override trail. Operators and auditors need evidence that supports reproduction and control testing. An affected person needs a meaningful explanation and an accessible route to review or redress. Review outcomes, corrections and their reasons return to the evidence record. A persuasive model-generated narrative alone does not establish the causes of the decision.</desc>
<defs><marker id="decision-evidence-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" viewBox="0 0 8 8"><path d="M0,1 L7,4 L0,7" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="960" height="655" fill="#FBFCFD"/>
<text x="26" y="35" font-size="25" fill="#182633" font-weight="700" text-anchor="start">Build an evidence packet a reviewer can use</text>
<text x="26" y="65" font-size="17" fill="#526273" font-weight="400" text-anchor="start">A fluent model-generated rationale is a claim to validate, not proof of cause.</text>
