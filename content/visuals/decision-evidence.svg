<text x="42" y="336" font-size="17" fill="#182633" font-weight="400" text-anchor="start">Output; relevant evidence;</text>
<text x="42" y="361" font-size="17" fill="#182633" font-weight="400" text-anchor="start">known fidelity limits</text>
