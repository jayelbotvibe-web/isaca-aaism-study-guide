<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="deployment-responsibility-title deployment-responsibility-desc" font-family="Arial, Helvetica, sans-serif">
<title id="deployment-responsibility-title">Read the responsibility stack</title>
<desc id="deployment-responsibility-desc">These are illustrative arrangements, not a universal legal or contractual allocation. C means customer operation; P means provider operation or origin. In the embedded SaaS example, the provider operates the application and serving infrastructure and supplies the base model. With a consumed API, the customer operates its application while the provider supplies serving and the model. Neither example shows fine-tuning for this use case. For a provider-hosted fine-tune, the customer operates its application, serving is provider-operated, and the adaptation workflow is shared: customer tuning data and choices combine with provider training infrastructure. The base model has provider origin. For a self-hosted unchanged base model, the customer operates the application and serving infrastructure. The base has third-party origin and is not fine-tuned for this use case. Other arrangements are possible; hosting does not determine adaptation. Customer access decisions, data handling, local evaluation and verification of supplier evidence remain relevant across all arrangements. Determine hosting, origin, adaptation and legal role separately.</desc>
<defs><marker id="deployment-responsibility-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" viewBox="0 0 8 8"><path d="M0,1 L7,4 L0,7" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
