<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="supplier-chain-title supplier-chain-desc" font-family="Arial, Helvetica, sans-serif">
<title id="supplier-chain-title">Follow the dependency beyond your direct vendor</title>
<desc id="supplier-chain-desc">The illustrative primary chain runs from Calder’s application to an orchestration supplier, a model service and hosting infrastructure. Their roles and data-processing facts need verification. Data and labelling sources, retrieval services, tools and plugins introduce further dependencies. Follow provenance, access, isolation, action scope and component versions beyond the direct contract. Calder still owns its local access decisions, evaluation and integration choices. Supplier operation does not automatically determine statutory provider or deployer roles. Seek evidence and remedies for subprocessors, change notice, incident cooperation, deletion and export, and a tested exit. A direct contract does not describe the whole chain.</desc>
