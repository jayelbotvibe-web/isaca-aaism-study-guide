<path d="M634,181 L728,261" fill="none" stroke="#6E3B7E" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#tool-evaluation-arrow)"/>
<path d="M634,421 L728,388" fill="none" stroke="#286151" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#tool-evaluation-arrow)"/>
<rect x="26" y="536" width="908" height="82" rx="12" fill="#EDF3F8" stroke="#26557A" stroke-width="1.7"/>
<text x="46" y="566" font-size="21" fill="#26557A" font-weight="700" text-anchor="start">Decide against agreed criteria</text>
<text x="46" y="595" font-size="17" fill="#182633" font-weight="400" text-anchor="start">Approve a bounded use, request remediation or reject; record residual gaps and ownership.</text>
<path d="M834,457 V530" fill="none" stroke="#26557A" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#tool-evaluation-arrow)"/>
</svg>
