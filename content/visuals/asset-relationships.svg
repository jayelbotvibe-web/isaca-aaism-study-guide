<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="asset-relationships-title asset-relationships-desc" font-family="Arial, Helvetica, sans-serif">
<title id="asset-relationships-title">Inventory the connected system</title>
<desc id="asset-relationships-desc">The MA-01 use-case record connects the accountable owner, classification, status and reassessment triggers to the system’s component records. Source manuals feed a corpus and index, which feed the application. The application can call a work-order tool. Record source rights and versions, chunks, vectors, access-control lists, prompts, policy and permitted actions. Connect model and provider versions, terms and dependencies to the application. Connect invoking-user, service and agent identities and permissions to tool access. Logs, caches and evaluation records are linked assets with their own protections. A material change to any dependency can reopen the use-case approval and risk evidence.</desc>
