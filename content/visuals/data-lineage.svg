<text x="548" y="594" font-size="19" fill="#955017" font-weight="700" text-anchor="start">Model influence</text>
<text x="512" y="623" font-size="17" fill="#182633" font-weight="400" text-anchor="start">Assess evidence and remedies: unlearning,</text>
