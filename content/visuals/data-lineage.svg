<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 715" role="img" aria-labelledby="data-lineage-title data-lineage-desc" font-family="Arial, Helvetica, sans-serif">
<title id="data-lineage-title">A source document can leave several kinds of trace</title>
<desc id="data-lineage-desc">The retrieval path can leave source documents, chunks, embeddings, index metadata, prompt context, generated responses, caches, logs and backups. Trace the actual architecture rather than assuming every listed store exists. A training path can retain a versioned data snapshot and produce weights that retain influence or information from the source. Source deletion does not prove this influence has been removed. A deletion or correction request follows both branches. Check rights, lawful retention, propagation and verification for each actual copy and derived store. Separately assess trained-model influence and evidence for suitable remedies, which may include model-specific unlearning, retraining, restriction or another lawful action. Output filtering alone is not evidence of deletion.</desc>
<defs><marker id="data-lineage-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" viewBox="0 0 8 8"><path d="M0,1 L7,4 L0,7" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="960" height="715" fill="#FBFCFD"/>
<text x="26" y="35" font-size="25" fill="#182633" font-weight="700" text-anchor="start">A source document can leave several kinds of trace</text>
<text x="26" y="65" font-size="17" fill="#526273" font-weight="400" text-anchor="start">Trace actual stores and duties; deleting one object does not settle the whole request.</text>
