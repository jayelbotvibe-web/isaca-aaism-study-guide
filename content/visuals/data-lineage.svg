<text x="666" y="182" font-size="17" fill="#182633" font-weight="400" text-anchor="start">Prompt context, responses,</text>
<text x="666" y="207" font-size="17" fill="#182633" font-weight="400" text-anchor="start">cache, logs and backups</text>
