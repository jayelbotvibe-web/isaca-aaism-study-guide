<text x="46" y="417" font-size="21" fill="#286151" font-weight="700" text-anchor="start">Every material finding needs a route to closure</text>
<rect x="46" y="449" width="185" height="34" rx="17" fill="#EDF6F2" stroke="#286151" stroke-width="1.7"/>
