<path d="M63,216 a11,11 0 1,0 -22,0 a11,11 0 1,0 22,0 M60,225 l12,12" fill="none" stroke="#26557A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="219" font-size="19" fill="#26557A" font-weight="700" text-anchor="start">Coverage</text>
<text x="42" y="248" font-size="17" fill="#182633" font-weight="400" text-anchor="start">Is the system in scope?</text>
<text x="42" y="273" font-size="17" fill="#182633" font-weight="400" text-anchor="start">Inventory and owner records</text>
<path d="M62,168 L62,185" fill="none" stroke="#26557A" stroke-width="2"/>
<circle cx="374" cy="139" r="26" fill="#F4EDF6" stroke="#6E3B7E" stroke-width="1.7"/>
<text x="374" y="147" font-size="22" fill="#6E3B7E" font-weight="700" text-anchor="middle">2</text>
<rect x="338" y="190" width="284" height="150" rx="12" fill="#F4EDF6" stroke="#6E3B7E" stroke-width="1.7"/>
<path d="M367,205 l14,6 v10 q-1,10 -14,17 q-13,-7 -14,-17 V211 Z M360,221 l5,5 l10,-12" fill="none" stroke="#6E3B7E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="390" y="219" font-size="19" fill="#6E3B7E" font-weight="700" text-anchor="start">Control operation</text>
<text x="354" y="248" font-size="17" fill="#182633" font-weight="400" text-anchor="start">Does the control work?</text>
<text x="354" y="273" font-size="17" fill="#182633" font-weight="400" text-anchor="start">Negative tests and review logs</text>
<path d="M374,168 L374,185" fill="none" stroke="#6E3B7E" stroke-width="2"/>
<circle cx="686" cy="139" r="26" fill="#FAF1E7" stroke="#955017" stroke-width="1.7"/>
<text x="686" y="147" font-size="22" fill="#955017" font-weight="700" text-anchor="middle">3</text>
<rect x="650" y="190" width="284" height="150" rx="12" fill="#FAF1E7" stroke="#955017" stroke-width="1.7"/>
<path d="M664,205 v30 h32 M669,227 l8,-11 l8,5 l10,-15" fill="none" stroke="#955017" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="702" y="219" font-size="19" fill="#955017" font-weight="700" text-anchor="start">Outcomes</text>
<text x="666" y="248" font-size="17" fill="#182633" font-weight="400" text-anchor="start">Is harm being controlled?</text>
<text x="666" y="273" font-size="17" fill="#182633" font-weight="400" text-anchor="start">Incidents and affected people</text>
<path d="M686,168 L686,185" fill="none" stroke="#955017" stroke-width="2"/>
