<text x="584.5" y="472" font-size="16" fill="#286151" font-weight="700" text-anchor="middle">Due date</text>
<rect x="715" y="449" width="185" height="34" rx="17" fill="#EDF6F2" stroke="#286151" stroke-width="1.7"/>
<text x="807.5" y="472" font-size="16" fill="#286151" font-weight="700" text-anchor="middle">Retest / report</text>
<path d="M233,466 L264,466" fill="none" stroke="#286151" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#program-evidence-arrow)"/>
<path d="M456,466 L487,466" fill="none" stroke="#286151" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#program-evidence-arrow)"/>
<path d="M679,466 L710,466" fill="none" stroke="#286151" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#program-evidence-arrow)"/>
<text x="46" y="526" font-size="18" fill="#182633" font-weight="400" text-anchor="start">Report denominators, blind spots and unresolved exceptions with the result.</text>
</svg>
