<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="program-evidence-title program-evidence-desc" font-family="Arial, Helvetica, sans-serif">
<title id="program-evidence-title">Three questions for a program report</title>
<desc id="program-evidence-desc">Coverage asks whether relevant AI systems are inventoried and assigned owners. Control operation asks whether tests and review logs show the control functioning. Outcomes ask about incidents, harm and affected people. These measures complement each other: a system can be in scope while a control fails, and a clean incident count alone does not prove effective control. Material findings require a named owner, funded action, a due date, and retesting and reporting. Include denominators, blind spots and unresolved exceptions.</desc>
<defs><marker id="program-evidence-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" viewBox="0 0 8 8"><path d="M0,1 L7,4 L0,7" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="960" height="600" fill="#FBFCFD"/>
<text x="26" y="35" font-size="25" fill="#182633" font-weight="700" text-anchor="start">Three questions for a program report</text>
<text x="26" y="65" font-size="17" fill="#526273" font-weight="400" text-anchor="start">Use complementary measures; a covered system can still have a failing control.</text>
<path d="M26,86 L934,86" fill="none" stroke="#BBCAD6" stroke-width="2"/>
<circle cx="62" cy="139" r="26" fill="#EDF3F8" stroke="#26557A" stroke-width="1.7"/>
